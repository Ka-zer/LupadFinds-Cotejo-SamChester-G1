{% extends "base.html" %}
{% load static %}
{% block title %}Edit Profile | LupadFinds{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/accounts.css' %}?v=3">{% endblock %}

{% block content %}
<div class="form-card">
  <h2>Edit profile</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button type="submit" class="btn">Save changes</button>
      <a class="btn btn-secondary" href="{% url 'profile' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
